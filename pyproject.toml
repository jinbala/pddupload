[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pdd-listing-automation"
version = "0.1.0"
description = "Browser workflow automation for 17zwd, Pinduoduo and Douyin listing"
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.50,<2",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
pdd-listing = "pdd_listing_automation.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
